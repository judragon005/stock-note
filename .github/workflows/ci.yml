name: 專案自動化測試與 CI 流水線

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.scratch/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.scratch/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: 自動化單元測試與語法驗證
    runs-on: ubuntu-latest

    steps:
      - name: 簽出原始碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境 (Set up Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝相依套件 (Install dependencies)
        run: npm ci

      - name: 執行 TypeScript 語法與型別檢查 (Type Check)
        run: npx tsc --noEmit

      - name: 執行 Vitest 會計引擎自動化單元測試 (Run Vitest)
        run: npm test

      - name: 敏感資訊防禦檢查 (Secrets Guard)
        run: |
          echo "=== 檢查是否存在敏感環境變數檔案 ==="
          if [ -f .env ]; then
            echo "❌ 警告：發現 .env 檔案被提交至儲存庫！"
            exit 1
          fi
          echo "✅ 敏感資訊防禦檢查通過"

      - name: 自動化測試完成通報 (Summary)
        run: |
          echo "========================================"
          echo "🎉 CI 自動化單元測試與型別校驗全部通過！"
          echo "========================================"
